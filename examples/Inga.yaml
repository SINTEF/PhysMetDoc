# Treeweaver version
version: "2.0"

# Default variable
environment:
  prefix: "idk"

  rightsHolder: "org:NTNU"
  license: "https://spdx.org"  # XXX - define a license (this means All Rights Reserved)

  project: "proj:PhysMet"              # Project that created a sample or dataset
  contactPoint: "pers:RandiHolmestad"  # Project leader or Supervisor
  creator: "pers:IngaKonow"            # Creator of sample or dataset
  operator: "pers:IngaKonow"           # Operator of an instrument

  # URL to the root folder of your data
  baseURL: "https://studntnu.sharepoint.com/sites/o365_SFIPhysMet/Shared%20Documents/Reseach%20Areas,%20RA%20(Open%20channel)/RA%201%20Multi-scale%20material%20analyses/Datasets%20Inga%20Konow"


  # Empty defaults - will be ignored if not set by a pattern
  hasComposition: ""
  isDatumOf: ""
  processedFrom: ""
  location: ""
  isTemporalPartOf: ""
  isSpatioTemporalPartOf: ""
  downloadURL: ""
  technique: ""


# Patterns matching
# Variables will assigned
patterns:
- "TEM/{alloy}/{treatment}/{instrument}/{session}/{data}":
    mappings:
      "instrumentId:instrument":
        "ARM": "temgemini:ARM200F"
        "2100": "temgemini:2100"
        "2100F": "temgemini:2100F"
        "GARM": "temgemini:GARM300F2"
    vars:
      sampleId: "sample-{treatment}"
      datasetId: "data-{instrument}-{session}-{treatment}-{data}"
      measurementId: "{instrument}-{session}-{treatment}-{data}"
      equipmentId: "{instrumentId}"
      processedFrom: "{prefix}:{sampleId}"
      sessionDataId: "data-{instrument}-{session}-{treatment}"
      sessionId: "{instrument}-{session}-{treatment}"
      isDatumOf: "{prefix}:{sessionDataId}"

- "SEM/{alloy}/{method}/{treatment}/{data}":
    vars:
      sampleId: "sample-{treatment}"
      datasetId: "data-{method}-{treatment}-{data}"
      measurementId: "{method}-{treatment}-{data}"
      equipmentId: "pfiblab:Helios_G5"
      processedFrom: "{prefix}:{treatment}"
      sessionDataId: "data-{method}-{treatment}"
      sessionId: "{method}-{treatment}"
      isDatumOf: "{prefix}:{sessionDataId}"



# List of file patterns to exclude from documentation
exclude:
- ".*"
- "~*"
- "*~"
- "README*"

# The different types of data to document
# You probably don't need to modify these
templates:
  sample:
    "@id": "{prefix}:{sampleId}"
    "@type": chameo:Sample
    title: "{sampleId}"
    description: ""
    comment: ""
    hasComposition: "{hasComposition}"
    wasGeneratedBy: "{project}"
    contactPoint: "{contactPoint}"
    creator: "{creator}"
    #creationDate: "{ctime}"
    location: "{location}"
    isTemporalPartOf: "{isTemporalPartOf}"
    isSpatioTemporalPartOf: "{isSpatioTemporalPartOf}"

  dataset:
    "@id": "{prefix}:{datasetId}"
    #"@type": ["emmo:Dataset", "dcat:Dataset"]
    "@type": "emmo:Dataset"
    title: "{datasetId}"
    description: ""
    comment: ""
    keyword: ""
    rightsHolder: "{rightsHolder}"
    license: "{license}"
    wasGeneratedBy: "{project}"
    contactPoint: "{contactPoint}"
    creator: "{creator}"
    seeAlso: ""
    releaseDate: "{ctime}"
    version: ""
    priorVersion: ""
    processedFrom: "{processedFrom}"
    isDatumOf: "{isDatumOf}"
    distribution.downloadURL: "{escapedurl}"

  measurement:
    "@id": "{prefix}:{measurementId}"
    "@type": "emmo:Measurement"
    title: "{measurementId}"
    description: ""
    comment: ""
    hasInput: "{prefix}:{sampleId}"
    hasOutput: "{prefix}:{datasetId}"
    hasOperator: "{operator}"
    hasParticipant: "{equipmentId}"
    isTemporalPartOf: "{prefix}:{sessionId}"
    #technique: "{technique}"

  session:
    "@id": "{prefix}:{sessionId}"
    "@type": "emmo:Measurement"
    title: "{sessionId}"
    description: ""
    comment: ""
    hasInput: "{prefix}:{sampleId}"
    hasOutput: "{prefix}:{sessionDataId}"
    hasOperator: "{operator}"
    hasParticipant: "{equipmentId}"

  sessionData:
    "@id": "{prefix}:{sessionDataId}"
    "@type": "emmo:Dataset"
    title: "{sessionDataId}"
    description: ""
    comment: ""
    keyword: ""
    rightsHolder: "{rightsHolder}"
    license: "{license}"
    wasGeneratedBy: "{project}"
    contactPoint: "{contactPoint}"
    creator: "{creator}"
    seeAlso: ""
    #releaseDate: "{ctime}"
    version: ""
    priorVersion: ""
    processedFrom: "{processedFrom}"
    distribution.accessURL: "{escapedurl}"
