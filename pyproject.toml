[project]
name = "physmetdoc"
version = "0.1.0"
description = "Data documentation templates and tools for physical metallurgy."
readme = "README.md"
authors = [
    { name = "Jesper Friis", email = "jesper.friis@sintef.no" },
    { name = "Tor S. Haugland", email = "tor.haugland@sintef.no" },
    { name = "Sylvain Gouttebroze", email = "sylvain.gouttebroze@sintef.no" },
    { name = "Michele Brigadoi", email = "michele.brigadoi@unibo.it" },
]
requires-python = ">=3.10"

# NOTE: During development, it is ok to specify git dependencies like
#
#    tripper[datadoc] @ git+https://github.com/EMMC-ASBL/tripper.git@master
#
# but for release these must match package version.
dependencies = [
    "PyYAML>=6.0.3",
    "parse>=1.22.1",
    "wcmatch>=11.0.1",
    #"tripper[datadoc] @ git+https://github.com/EMMC-ASBL/tripper.git@master",
    "tripper[datadoc]>=0.5.5",
    "jsonschema>=4.26.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
excel = ["openpyxl"]
callfunctions = [
    "pillow>=12.0.0",
    "ncempy>=1.16",
]
testing = [
    "physmetdoc[excel,callfunctions]",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]
pre-commit = [
    "physmetdoc[testing]",
    "pre-commit==4.6.2",
    "ruff==0.17.3",
]
dev = [
    "physmetdoc[pre-commit]",
    "keyring>=25.6.0",
]

[project.scripts]
treeweaver = "treeweaver.treeweaver:main"
treeweaver2 = "treeweaver.treeweaver2:main"
oold-converter = "oold_converter.oold_converter:main"
extract-prefixes = "extract_prefixes:main"
compositions = "compositions.compositions:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 79

# Explicitly tell Hatchling where your packages live
[tool.hatch.build.targets.wheel]
packages = [
    "src/extract_prefixes.py",
    "src/compositions",
    "src/oold_converter",
    "src/tabular",
    "src/treeweaver",
]

[tool.hatch.build.targets.sdist]
include = ["/src/oold_converter", "/src/tabular", "/src/treeweaver"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 79

[tool.ruff.lint]
# E/F = standard syntax errors/style (defaults)
# I = import sorting (isort replacement)
# UP = modern Python syntax upgrades
# B = common design flaws, code smells, and subtle bugs
# SIM = simplification opportunities
# S = security (bandit replacement)
# T20 = debugging statement checks (debug-statements replacement)
select = ["E", "F", "I", "UP", "B", "SIM", "S", "T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = [
    "extract_prefixes",
    "oold_converter",
    "tabular",
    "treeweaver",
]
