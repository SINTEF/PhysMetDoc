[project]
name = "physmetdoc"
version = "0.1.0"
description = "Data documentation templates and tools for physical metallurgy."
readme = "README.md"
authors = [
    { name = "Jesper Friis", email = "jesper.friis@sintef.no" },
    { name = "Tor S. Haugland", email = "tor.haugland@sintef.no" },
    { name = "Sylvain Gouttebroze", email = "sylvain.gouttebroze@sintef.no" },
    { name = "Michele Brigadoi", email = "michele.brigadoi@unibo.it" },
]
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0.3",
    "parse>=1.22.1",
    "jsonschema>=4.26.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
excel = ["openpyxl"]
testing = [
    "physmetdoc[excel]",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]
pre-commit = [
    "physmetdoc[testing]",
    "pre-commit==4.6.2",
    "pylint==4.0.8",
]
dev = [
    "physmetdoc[pre-commit]",
    "virtualenvwrapper==6.1.1",
]

[project.scripts]
treeweaver = "treeweaver.treeweaver:main"
treeweaver2 = "treeweaver.treeweaver2:main"
oold-converter = "oold_converter.oold_converter:main"
extract-prefixes = "extract_prefixes:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 79

# Explicitly tell Hatchling where your packages live
[tool.hatch.build.targets.wheel]
packages = [
    "src/extract_prefixes.py",
    "src/oold_converter",
    "src/tabular",
    "src/treeweaver",
]

[tool.hatch.build.targets.sdist]
include = ["/src/oold_converter", "/src/tabular", "/src/treeweaver"]

[tool.pylint.messages_control]
disable = ["too-few-public-methods", "redefined-builtin"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = [
    "extract_prefixes",
    "oold_converter",
    "tabular",
    "treeweaver",
]
